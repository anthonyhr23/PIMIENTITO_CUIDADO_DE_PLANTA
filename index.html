@keyframes ppfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@keyframes spin{to{transform:rotate(360deg)}}

<script>
/* ── Reloj local ── */
function tick(){
  const n=new Date();
  document.getElementById('clock-t').textContent=n.toLocaleTimeString('es-EC');
  document.getElementById('clock-d').textContent=n.toLocaleDateString('es-EC',{weekday:'short',day:'2-digit',month:'short'});
}
tick(); setInterval(tick,1000);
 
/* ── Estrellas ── */
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<55;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()<.25?2:1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*65}%;opacity:0;transition:opacity ${1+Math.random()*1.5}s`;
    c.appendChild(s);
  }
})();
 
/* ── Cielo ── */
const SKIES={
  day:    {bg:'#56aae8',sunC:'#FFD93D',sL:'42%',sT:'28px',sO:1, mO:0,c:[.7,.75,0,0,0],   stars:0},
  cloudy: {bg:'#8ca8b8',sunC:'#FFD93D',sL:'42%',sT:'28px',sO:.2,mO:0,c:[.95,.9,.92,.88,.85],stars:0},
  sunrise:{bg:'#f0914a',sunC:'#FFB830',sL:'12%',sT:'45px',sO:1, mO:0,c:[.5,.4,.15,0,0],  stars:.2},
  sunset: {bg:'#d96b2a',sunC:'#ff7d00',sL:'78%',sT:'55px',sO:1, mO:0,c:[.3,.25,0,0,0],   stars:.25},
  night:  {bg:'#0c1a3a',sunC:'#FFD93D',sL:'105%',sT:'80px',sO:0,mO:1,c:[0,0,0,0,0],      stars:1}
};
function skyFromLux(lux){
  if(lux===null){const h=new Date().getHours();return h>=6&&h<8?'sunrise':h>=8&&h<17?'day':h>=17&&h<20?'sunset':'night';}
  if(lux>800)  return 'day';
  if(lux>200)  return 'cloudy';
  if(lux>30)   return 'sunrise';
  if(lux>5)    return 'sunset';
  return 'night';
}
function applySky(state){
  const s=SKIES[state]||SKIES.day;
  document.getElementById('sky').style.background=s.bg;
  const sun=document.getElementById('sun');
  sun.style.background=s.sunC;sun.style.left=s.sL;sun.style.top=s.sT;sun.style.opacity=s.sO;
  document.getElementById('moon').style.opacity=s.mO;
  ['cl1','cl2','cl3','cl4','cl5'].forEach((id,i)=>document.getElementById(id).style.opacity=s.c[i]);
  document.querySelectorAll('.star').forEach(st=>st.style.opacity=s.stars*(Math.random()>.35?.85:.3));
  const luxEl=document.getElementById('dlux');
  if(state==='night')        luxEl.style.color='#7ecfc0';
  else if(state==='sunset'||state==='sunrise') luxEl.style.color='#ffc45a';
  else if(state==='cloudy')  luxEl.style.color='#b8d8e8';
  else                       luxEl.style.color='#fffbe8';
}
applySky(skyFromLux(null));
 
/* ── Moods ── */
const MOODS={
  ALERTA:{mouth:'M49 138 Q55 134 61 138',bl:'M46 120 Q50 123 54 121',br:'M56 121 Q60 123 64 120',
    cheek:0,sweat:1,bang:1,anim:'ppshake',bubble:'😰 ¡Riégame YA!',bcolor:'#e05252',
    eval:'RIEGO YA',edesc:'humedad crítica — riega de inmediato',ecolor:'#ff7a7a'},
  RIEGO:{mouth:'M49 136 Q55 139 61 136',bl:'M46 121 Q50 120 54 121',br:'M56 121 Q60 120 64 121',
    cheek:0,sweat:1,bang:0,anim:'ppfloat',bubble:'😟 Necesito agua…',bcolor:'#e08535',
    eval:'NECESITA AGUA',edesc:'humedad baja — riega pronto',ecolor:'#ffc45a'},
  NORMAL:{mouth:'M49 135 Q55 138 61 135',bl:'M46 122 Q50 120 54 121',br:'M56 121 Q60 120 64 122',
    cheek:0,sweat:0,bang:0,anim:'ppfloat',bubble:'😐 Todo bien',bcolor:'#7ecf8e',
    eval:'TIERRA OK',edesc:'condiciones normales',ecolor:'#b8f0c0'},
  FELIZ:{mouth:'M47 133 Q55 141 63 133',bl:'M46 124 Q50 121 54 123',br:'M56 123 Q60 121 64 124',
    cheek:.65,sweat:0,bang:0,anim:'ppbounce',bubble:'😄 ¡Feliz!',bcolor:'#3ddc6e',
    eval:'ÓPTIMO',edesc:'planta en condiciones ideales 🌶️',ecolor:'#3ddc6e'}
};
let lastEstado='';
function applyMood(estado){
  if(estado===lastEstado)return; lastEstado=estado;
  const m=MOODS[estado]||MOODS.NORMAL;
  document.getElementById('pm').setAttribute('d',m.mouth);
  document.getElementById('brl').setAttribute('d',m.bl);
  document.getElementById('brr').setAttribute('d',m.br);
  document.getElementById('ckl').setAttribute('opacity',m.cheek);
  document.getElementById('ckr').setAttribute('opacity',m.cheek);
  document.getElementById('psweat').style.opacity=m.sweat?'1':'0';
  document.getElementById('pbang').setAttribute('opacity',m.bang);
  const pg=document.getElementById('pg');
  pg.style.animation='none';
  setTimeout(()=>{pg.style.animation=`${m.anim} 2.8s ease-in-out infinite`;pg.style.transformOrigin='55px 130px';},30);
  const bub=document.getElementById('bubble');
  bub.textContent=m.bubble;bub.style.borderColor=m.bcolor+'55';bub.style.opacity='1';
  document.getElementById('estado-val').textContent=m.eval;
  document.getElementById('estado-val').style.color=m.ecolor;
  document.getElementById('estado-desc').textContent=m.edesc;
}
 
/* ── Loader ── */
let loaderPct=0;
const loaderInterval=setInterval(()=>{
  loaderPct=Math.min(loaderPct+8,85);
  document.getElementById('loader-bar').style.width=loaderPct+'%';
},300);
function hideLoader(){
  clearInterval(loaderInterval);
  document.getElementById('loader-bar').style.width='100%';
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),400);
}
 
/* ── Procesar datos de Firebase ── */
let firstLoad=true;
 
function procesarDatos(d){
  if(!d||typeof d!=='object')return;
  if(firstLoad){firstLoad=false;hideLoader();}
 
  document.getElementById('cdot').classList.add('on');
  document.getElementById('hdot').classList.add('on');
  document.getElementById('clabel').textContent='en vivo ⚡';
  document.getElementById('hconn').textContent='en vivo';
  document.getElementById('cupd').textContent=new Date().toLocaleTimeString('es-EC');
 
  const temp=parseFloat(d.temperatura)||0;
  const hum=parseInt(d.humedad)||0;
  const lux=parseFloat(d.luz)||0;
  const estado=(d.estado||'NORMAL').toUpperCase().trim();
 
  document.getElementById('dtemp').textContent=temp.toFixed(1);
  document.getElementById('dhum').textContent=hum;
  document.getElementById('dlux').textContent=Math.round(lux);
 
  document.getElementById('dtemp').style.color=temp>38?'#ff7a7a':temp>30?'#ffc45a':'#e8fce8';
  document.getElementById('dhum').style.color=hum<15?'#ff7a7a':hum<30?'#ffc45a':hum>60?'#6fd4ff':'#e8fce8';
 
  applySky(skyFromLux(lux));
  applyMood(estado);
}
 
/* ══════════════════════════════════════════════════════
   CONEXIÓN FIREBASE — EventSource (tiempo real nativo)
   Reemplaza el polling cada 2 s por streaming SSE.
   Firebase RTDB soporta ?accept=text/event-stream
   nativamente: el servidor empuja el dato en cuanto
   el ESP32 escribe, sin necesidad de volver a pedir.
   ══════════════════════════════════════════════════════ */
const DB_BASE = 'https://ecofy-b94e9-default-rtdb.firebaseio.com/ECOFY';
const DB_STREAM = DB_BASE + '.json?accept=text/event-stream';
const DB_REST   = DB_BASE + '.json';
 
let evtSource = null;
let reconectarTimeout = null;
let fallCount = 0;
 
function marcarDesconectado(){
  document.getElementById('cdot').classList.remove('on');
  document.getElementById('hdot').classList.remove('on');
  document.getElementById('clabel').textContent='reconectando…';
  document.getElementById('hconn').textContent='sin conexión';
}
 
/* ── Fallback: fetch REST una sola vez para arrancar rápido ── */
async function fetchUnaVez(){
  try{
    const res=await fetch(DB_REST);
    if(!res.ok)return;
    const d=await res.json();
    procesarDatos(d);
  }catch(e){
    console.warn('Fetch inicial fallido:',e);
  }
}
 
/* ── Iniciar EventSource (streaming en tiempo real) ── */
function conectarStream(){
  if(evtSource){evtSource.close();evtSource=null;}
  clearTimeout(reconectarTimeout);
 
  try{
    evtSource=new EventSource(DB_STREAM);
 
    /* Evento "put": llega cuando Firebase escribe cualquier campo bajo /ECOFY */
    evtSource.addEventListener('put',function(e){
      try{
        fallCount=0;
        const msg=JSON.parse(e.data);
        /* msg.path puede ser "/" (todo el nodo) o "/campo" (campo suelto) */
        if(msg.path==='/' && msg.data && typeof msg.data==='object'){
          procesarDatos(msg.data);
        } else if(msg.path && msg.path.length>1){
          /* Actualización parcial: releer el nodo completo */
          fetchUnaVez();
        }
      }catch(err){console.warn('Parse SSE:',err);}
    });
 
    /* Evento "patch": actualizaciones parciales */
    evtSource.addEventListener('patch',function(e){
      try{
        fallCount=0;
        fetchUnaVez(); /* re-leer completo para garantizar consistencia */
      }catch(err){console.warn('Patch SSE:',err);}
    });
 
    evtSource.onerror=function(){
      fallCount++;
      marcarDesconectado();
      evtSource.close();
      evtSource=null;
      /* Reintentar en 3 s — EventSource nativo no siempre reconecta con RTDB */
      reconectarTimeout=setTimeout(conectarStream, 3000);
    };
 
  }catch(e){
    /* Navegador sin soporte EventSource — caer en polling lento */
    console.warn('EventSource no soportado, usando polling:',e);
    usarPolling();
  }
}
 
/* ── Polling de respaldo (solo si EventSource falla) ── */
function usarPolling(){
  fetchUnaVez();
  setInterval(fetchUnaVez, 3000);
}
 
/* ── Arranque: fetch inmediato + stream ── */
fetchUnaVez();       /* muestra datos de inmediato sin esperar el handshake SSE */
conectarStream();    /* abre el canal de tiempo real */
</script>
